<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05080c">
  <meta name="robots" content="noindex">
  <title>After Dismissal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fffdf8;
      background:
        radial-gradient(circle at 50% 45%, rgba(73, 100, 125, 0.16), transparent 28%),
        #05080c;
      font-family: "DM Mono", monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.025;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.25) 0 1px,
          transparent 1px 4px
        );
    }

    .room {
      width: min(calc(100% - 2rem), 720px);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.018);
      box-shadow: 0 35px 95px rgba(0,0,0,0.48);
    }

    .code {
      margin: 0 0 1rem;
      color: #c0a16b;
      font-size: 0.64rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.95;
      font-weight: 600;
    }

    .message {
      margin: 1.5rem 0 0;
      color: rgba(255,255,255,0.62);
      line-height: 1.8;
    }

    .second {
      margin-top: 1.5rem;
      color: #e1cda7;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      font-style: italic;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fffdf8;
      text-decoration: none;
      font-size: 0.72rem;
    }

    a:hover {
      border-color: #c0a16b;
      color: #e1cda7;
    }

    .bell {
      position: fixed;
      right: 18px;
      bottom: 14px;
      color: rgba(255,255,255,0.06);
      font-size: 0.7rem;
    }
  </style>
</head>

<body>
  <main class="room">
    <p class="code">Northdown High School · After-hours access</p>

    <h1>
      How did you
      <br>
      get here?
    </h1>

    <p class="message">
      The building is closed.
      <br>
      All students and staff have been dismissed.
      <br>
      This page should not exist.
    </p>

    <p class="second">
      The second bell does not indicate dismissal.
    </p>

    <a href="index.html">Return before anyone notices</a>
  </main>

  <span class="bell">bell detected: 2</span>
</body>
</html>
