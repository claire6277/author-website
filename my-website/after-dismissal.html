<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ACCESS VIOLATION</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#06070b;

color:#ddd;

font-family:"Cormorant Garamond",serif;

height:100vh;

display:grid;

place-items:center;

overflow:hidden;

}

body::before{

content:"";

position:fixed;
inset:0;

background:
radial-gradient(circle at top,
rgba(194,168,108,.06),
transparent 40%);

pointer-events:none;

}

main{

width:min(760px,90vw);

text-align:center;

padding:4rem;

border:1px solid rgba(194,168,108,.22);

background:rgba(255,255,255,.02);

backdrop-filter:blur(12px);

box-shadow:
0 30px 70px rgba(0,0,0,.45);

}

.small{

font-family:"DM Mono",monospace;

font-size:.72rem;

letter-spacing:.25em;

text-transform:uppercase;

color:#8b8b8b;

margin-bottom:2rem;

}

h1{

font-size:clamp(2.5rem,6vw,5rem);

margin-bottom:2rem;

color:#c2a86c;

}

p{

font-size:1.25rem;

line-height:1.9;

max-width:560px;

margin:auto;

color:#cfcfcf;

}

.warning{

margin-top:3rem;

font-family:"DM Mono",monospace;

font-size:.72rem;

letter-spacing:.18em;

text-transform:uppercase;

color:#777;

}

.hidden{

opacity:0;

transition:opacity .8s ease;

}

.show{

opacity:1;

}

</style>

</head>

<body>

<main>

<div class="small">
UNAUTHORIZED ARCHIVE ACCESS
</div>

<h1>
How did you find this?
</h1>

<p id="message" class="hidden">

This archive is not referenced anywhere in the public records.

If you are reading this...

you were curious enough to keep looking.

We like curious people.

</p>

<div
class="warning hidden"
id="warning">

This page does not officially exist.

</div>

</main>

<script>

setTimeout(()=>{

document
.getElementById("message")
.classList.add("show");

},1200);

setTimeout(()=>{

document
.getElementById("warning")
.classList.add("show");

},2600);

</script>

</body>
</html>
